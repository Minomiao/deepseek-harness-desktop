name: Build

on:
  workflow_dispatch: # 手动触发
  push:
    tags: ["v*"] # 打 tag 自动构建

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            ext: exe
          - os: macos-latest
            args: --mac
            ext: dmg
          - os: ubuntu-latest
            args: --linux
            ext: AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.os }}
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # 跳过代码签名

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          # macOS 默认无 sha256sum，回退到 shasum -a 256
          if command -v sha256sum > /dev/null 2>&1; then HASH=sha256sum; else HASH="shasum -a 256"; fi
          for f in *.exe *.dmg *.AppImage *.zip; do
            [ -f "$f" ] && $HASH "$f" > "$f.sha256"
          done
          ls -1 *.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: |
            dist/*.${{ matrix.ext }}
            dist/*.zip
            dist/*.sha256
          if-no-files-found: warn
          retention-days: 30
