<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>DSH Desktop</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #000000;
      }
      .card {
        text-align: center;
        max-width: 560px;
        padding: 24px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 16px;
        border: 3px solid #d0d7de;
        border-top-color: #000000;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        margin: 4px 0;
        color: #000000;
        font-size: 13px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .error {
        color: #000000;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner" id="spinner"></div>
      <h1>正在启动 DeepSeek Harness…</h1>
      <p id="status">正在启动本地 dsh web 服务</p>
      <p class="error" id="error"></p>
    </div>
    <script src="loading.js"></script>
  </body>
</html>
